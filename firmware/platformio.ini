; ORBIT firmware — two build environments sharing one codebase.
; `lib/orbit_common/` is auto-discovered by PlatformIO and linked into both.
; `build_src_filter` picks exactly one main_*.cpp per environment so there's
; only ever one setup()/loop() pair in a given build.

[platformio]
default_envs = node_a

[env]
platform = espressif32
board = esp32dev          ; standard ESP32 devkit definition — correct for
                           ; ESP32-WROOM-32U too, since the U variant only
                           ; changes the antenna connector, not the chip
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib

[env:node_a]
build_src_filter = +<*> -<main_node_b.cpp>
; TODO: set to Node A's actual COM port (run `pio device list` to find it)
upload_port = COM5
monitor_port = COM5

[env:node_b]
build_src_filter = +<*> -<main_node_a.cpp>
; TODO: set to Node B's actual COM port (run `pio device list` to find it)
upload_port = COM6
monitor_port = COM6